version: 2
updates:

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
        - minor
        - patch
        patterns:
        - "*"
