# Generated by Wave 2 of the OSPS audit (osps-baseline-audit.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-non-security:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: helm
    directory: "/chart"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      helm-minor-and-patch:
        applies-to: version-updates
        update-types:
        - minor
        - patch
        patterns:
        - "*"
