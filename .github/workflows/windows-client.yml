#
# Builds and tests the Windows client. The important job here is the conformance suite: it runs the
# fixtures in contracts/ against the real workflow, so a change that makes the Windows client
# diverge from the shared behavioral contract fails the build rather than shipping.
#
# It runs on a Windows runner even though Domain and Workflow target plain net10.0, because the
# tray shell and adapters that land in later phases need Windows to compile at all.

name: Windows client

on:
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - 'contracts/**'
      - '.github/workflows/windows-client.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'contracts/**'
      - '.github/workflows/windows-client.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build-and-test:
    name: Build and run conformance
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/SSMConnect.slnx

      # Warnings are errors in Directory.Build.props, so this also enforces analyzer cleanliness.
      - name: Build
        run: dotnet build windows/SSMConnect.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test windows/SSMConnect.slnx --no-build --configuration Release

      # The portable-profile tests write the documents they exported. Validating those against the
      # schema is a check the .NET tests cannot make themselves: an exporter can satisfy every
      # in-language assertion and still emit a schema violation, such as an enum written as a
      # number, which is exactly what System.Text.Json does by default.
      - name: Validate exported profile documents against the schema
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python contracts/validate.py --profiles windows/tests/SSMConnect.Domain.Tests/bin/Release/net10.0/artifacts/exported-profiles
