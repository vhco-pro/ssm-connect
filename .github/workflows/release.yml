#
# The one release workflow and the only version authority. On a push to main, GitVersion computes
# the next version from conventional commits; the release job tags it and creates the GitHub Release
# first, without GitHub's latest mark. Each platform job then builds and uploads only its own assets,
# so a failed platform leaves its asset missing without blocking the others:
#
#   macos    the ad-hoc-signed .app ZIP, as before; macos-latest then marks the newest release with
#            a macOS ZIP as latest, in the queued release-latest group, so Homebrew's sync (which
#            reads the latest release) always finds a ZIP and a late older build never displaces it
#   windows  the per-user MSI, its checksum and the WinGet manifest hashed from that MSI
#
# Published assets never change: a rerun uploads only assets still missing, and a bad asset is
# fixed by releasing a new version, so Homebrew and WinGet checksums stay valid. Rerunning a whole
# run on an already-released commit reuses its tag and release.
#
# A manual run with test_tag (such as v0.0.0-test.1) builds the selected commit as a prerelease
# under that tag, without GitVersion and without the latest mark, to exercise the release path.

name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      test_tag:
        description: A prerelease test tag such as v0.0.0-test.1; empty releases the version GitVersion computes.
        required: false
        type: string

permissions: {}

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tag + create the GitHub Release
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Checkout (full history for GitVersion)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the release steps
        run: bash scripts/release/test-release-assets.sh

      # The same GitVersion the reusable gitversion-tag-action pins; tagging is done below so a
      # rerun of an already-tagged commit reuses its tag instead of failing.
      - name: Install GitVersion
        if: inputs.test_tag == ''
        uses: gittools/actions/gitversion/setup@03e8e0922292bf0491859846a823b253d8dd06ce # v4.6.0
        with:
          versionSpec: '6.8.0'

      - name: Compute the version
        id: gitversion
        if: inputs.test_tag == ''
        uses: gittools/actions/gitversion/execute@03e8e0922292bf0491859846a823b253d8dd06ce # v4.6.0
        with:
          configFilePath: gitversion.yml

      - name: Resolve and tag the version
        id: resolve
        env:
          TEST_TAG: ${{ inputs.test_tag }}
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: |
          if [ -n "$TEST_TAG" ]; then
            [[ "$TEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]] \
              || { echo "::error::A test tag is a prerelease version such as v0.0.0-test.1, got '$TEST_TAG'."; exit 1; }
            tag="$TEST_TAG"; prerelease=true
          else
            tag="v$SEMVER"; prerelease=false
          fi
          skip=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              # A commit that bumps nothing resolves to the version an earlier commit released.
              echo "::notice::$tag already belongs to an earlier commit; nothing to release."
              skip=true
            else
              echo "Reusing $tag on this commit."
            fi
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag "$tag" -m "$(git log -1 --pretty=%s)"
            git push origin "$tag"
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prerelease=$prerelease"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release without the latest mark
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          bash scripts/release/release-assets.sh ensure-release "$TAG" "SSM Connect $VERSION" \
            "$([ "$PRERELEASE" = true ] && echo --prerelease)"

  macos:
    name: macOS app
    needs: release
    if: needs.release.outputs.skip == 'false'
    # macOS 26 (Tahoe) runner: ships Xcode 26, which compiles the Icon Composer AppIcon.icon.
    runs-on: macos-26
    permissions:
      contents: write # upload the ZIP
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select the newest installed Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM + build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/DerivedData/SourcePackages
            .build/DerivedData/Build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xc${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-xc${{ steps.xcode.outputs.version }}-
            spm-${{ runner.os }}-

      - name: Stamp version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" SSMConnect/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" SSMConnect/Info.plist

      - name: Build + package the signed .app
        run: ./scripts/release.sh

      - name: Verify the app icon compiled (fail loudly, never ship a blank icon)
        run: |
          APP=".build/DerivedData/Build/Products/Release/SSMConnect.app"
          plutil -p "$APP/Contents/Info.plist" | grep -q CFBundleIconName \
            || { echo "::error::AppIcon did not compile: runner Xcode is too old for AppIcon.icon"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" \
            || { echo "::error::no AppIcon.icns in the bundle"; exit 1; }
          echo "AppIcon compiled"

      - name: Upload the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: bash scripts/release/release-assets.sh upload-missing "$TAG" "dist/SSMConnect-${VERSION}.zip"

  macos-latest:
    name: Mark the latest release
    needs: [release, macos]
    if: needs.release.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    # Queued, never cancelled in progress: an older run decides only after a newer one has finished.
    # mark-latest converges on the newest release with a ZIP, so a pending run GitHub replaces with
    # a later one loses nothing. It never considers a prerelease, so a test tag leaves the latest
    # release as it is.
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: write # set the latest mark
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark the newest release with a macOS ZIP as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/release-assets.sh mark-latest

      - name: Note cask sync
        run: echo "::notice::homebrew-tap's sync-cask bumps the cask from the latest release."

  windows:
    name: Windows MSI
    needs: release
    if: needs.release.outputs.skip == 'false'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write # upload the MSI
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257 # reviewed main commit
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      # A release must not ship a shell that would fail its own tests.
      - name: Test the shell
        run: dotnet test windows/SSMConnect.slnx --configuration Release

      - name: Build the MSI and the WinGet manifest
        id: package
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $lines = & ./packaging/windows/Build-Release.ps1 -Version $env:VERSION -Build "$env:VERSION+$($env:GITHUB_SHA.Substring(0, 12))"
          $lines | Where-Object { $_ -match '^(msi|sha256|manifest)=' } | Add-Content $env:GITHUB_OUTPUT
          "build=$env:VERSION+$($env:GITHUB_SHA.Substring(0, 12))" | Add-Content $env:GITHUB_OUTPUT

      # The package holds the helper, runtime and notices, the helper starts from it, the manifest
      # pins its hash, and on this disposable runner it installs, refuses while running, and removes.
      - name: Inspect and install the MSI
        shell: pwsh
        run: >
          ./packaging/windows/Test-Package.ps1 -Msi '${{ steps.package.outputs.msi }}'
          -Build '${{ steps.package.outputs.build }}' -Manifest '${{ steps.package.outputs.manifest }}' -Install

      - name: Upload the MSI and its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          MSI: ${{ steps.package.outputs.msi }}
        run: bash scripts/release/release-assets.sh upload-missing "$TAG" "$MSI" "$MSI.sha256"

      - name: Keep the WinGet manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifest-${{ needs.release.outputs.version }}
          path: ${{ steps.package.outputs.manifest }}

      # WinGet takes manifests as pull requests to microsoft/winget-pkgs. A release submits through
      # wingetcreate once the WINGET_TOKEN secret (a token that can fork and open pull requests)
      # exists; until then, and for test tags, the validated manifest stays a run artifact.
      - name: Submit the WinGet manifest
        if: needs.release.outputs.prerelease == 'false'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host '::notice::WINGET_TOKEN is not set; the validated manifest is kept as a run artifact for manual submission.'
            exit 0
          }
          # Pinned and verified, like every other downloaded tool.
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe -OutFile wingetcreate.exe
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne '63D980BA79E97042395BD6EB5992C2DB9E01E9E7A8A22958A95C288F27310413') {
            throw 'wingetcreate.exe failed verification.'
          }
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN '${{ steps.package.outputs.manifest }}'
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed with $LASTEXITCODE." }
