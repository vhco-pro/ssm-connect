# CodeQL code scanning. Advanced setup (not the repo's default setup) because the
# Swift sources only compile after `xcodegen generate` recreates the gitignored
# .xcodeproj — CodeQL's autobuild has nothing to build otherwise. Mirrors the
# release workflow's proven macOS build environment (newest Xcode for XcodeGen's
# objectVersion 77). Actions workflows are scanned on a cheap Linux runner.
name: CodeQL

# The Swift analysis does a clean build of aws-sdk-swift (slow), so to save runner
# time it runs on PRs to main + a weekly schedule, NOT on every push to main (code
# reaches main via PR, which is already scanned). The schedule keeps the default-
# branch baseline fresh.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # weekly, Monday 04:27 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
          - language: swift
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Swift build (XcodeGen + newest Xcode)
        if: matrix.language == 'swift'
        run: |
          brew install xcodegen
          # XcodeGen emits a recent project format the runner's default Xcode can be too old to read.
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcodegen generate

      # Cache resolved SwiftPM dependency *sources* (aws-sdk-swift is large to clone)
      # — NOT the build products, so CodeQL still traces a full clean compile.
      - name: Cache SwiftPM sources (Swift)
        id: swift-cache
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            SSMConnectKit/.build/checkouts
            SSMConnectKit/.build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: codeql-spm-v2-${{ runner.os }}-${{ hashFiles('SSMConnectKit/Package.resolved') }}
          restore-keys: |
            codeql-spm-v2-${{ runner.os }}-

      - name: Discard incomplete Swift source cache
        if: matrix.language == 'swift' && steps.swift-cache.outcome == 'failure'
        run: rm -rf SSMConnectKit/.build/checkouts SSMConnectKit/.build/repositories

      - name: Run Swift unit tests
        if: matrix.language == 'swift'
        run: swift test --package-path SSMConnectKit --disable-automatic-resolution

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build Swift (clean, unsigned — CodeQL traces the compile)
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project SSMConnect.xcodeproj \
            -scheme SSMConnect \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath SSMConnectKit/.build \
            -skipPackagePluginValidation \
            -skipPackageUpdates \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Autobuild (Actions)
        if: matrix.language == 'actions'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
